name: Checkmarx One Vscode Extension CI Linux Test cases

on: [pull_request]

permissions:
  contents: read # For reading repository code
  packages: read # For reading package versions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test the shared core package independently
  core-unit-tests:
    name: Core Unit Tests
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          persist-credentials: false
      - name: Verify single lockfile
        run: |
          if [ -f yarn.lock ] && [ -f package-lock.json ]; then
            echo "❌ ERROR: Both yarn.lock and package-lock.json found. Policy requires exactly ONE package manager. Allowed: npm + package-lock.json OR Yarn + yarn.lock"
            exit 1
          fi
          if [ ! -f yarn.lock ] && [ ! -f package-lock.json ]; then
            echo "❌ ERROR: No lockfile found. Policy requires exactly ONE package manager lockfile. Required: npm + package-lock.json OR Yarn + yarn.lock"
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 22.11.0
      - name: Authenticate with npm registries
        env:
          ECHO_TOKEN: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "registry=https://npm.echohq.com/" > ~/.npmrc
          echo "//npm.echohq.com/:_authToken=${ECHO_TOKEN}" >> ~/.npmrc
          echo "//packages.echohq.com/:_authToken=${ECHO_TOKEN}" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
      - name: Install dependencies
        env:
          NPM_CONFIG_LOGLEVEL: http
        run: |
          npm run ci:all
      - name: Run core unit tests with coverage
        run: npm run unit-coverage:test:core
      - name: Upload core coverage report
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 #v4
        with:
          name: coverage-core
          path: packages/core/coverage/
          retention-days: 7

  core-integration-tests:
    name: Core Integration Tests
    runs-on: cx-public-ubuntu-x64
    concurrency:
      group: core-integration-tests
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          persist-credentials: false
      - name: Verify single lockfile
        run: |
          if [ -f yarn.lock ] && [ -f package-lock.json ]; then
            echo "❌ ERROR: Both yarn.lock and package-lock.json found. Policy requires exactly ONE package manager. Allowed: npm + package-lock.json OR Yarn + yarn.lock"
            exit 1
          fi
          if [ ! -f yarn.lock ] && [ ! -f package-lock.json ]; then
            echo "❌ ERROR: No lockfile found. Policy requires exactly ONE package manager lockfile. Required: npm + package-lock.json OR Yarn + yarn.lock"
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 22.11.0
      - name: Authenticate with npm registries
        env:
          ECHO_TOKEN: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "registry=https://npm.echohq.com/" > ~/.npmrc
          echo "//npm.echohq.com/:_authToken=${ECHO_TOKEN}" >> ~/.npmrc
          echo "//packages.echohq.com/:_authToken=${ECHO_TOKEN}" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
      - name: Install dependencies
        env:
          NPM_CONFIG_LOGLEVEL: http
        run: |
          npm run ci:all
      - name: Ensure Docker is available (required by TestKicsRealtime.test.ts)
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "❌ Docker is not installed on this runner. This job requires a runner image with Docker preinstalled (e.g. GitHub-hosted cx-public-ubuntu-x64)."
            exit 1
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "Docker daemon not reachable — attempting to start it..."
            sudo systemctl start docker || sudo service docker start
            for i in $(seq 1 10); do
              docker info >/dev/null 2>&1 && break
              sleep 2
            done
          fi
          docker info
      - name: Run core integration tests with coverage
        env:
          CX_API_KEY: ${{ secrets.CX_API_KEY }}
          CX_TEST_PROJECT_ID: ${{ secrets.CX_TEST_PROJECT_ID }}
          CX_TEST_BRANCH: ${{ secrets.CX_TEST_BRANCH }}
          CX_TEST_SCAN_ID: ${{ secrets.CX_TEST_SCAN_ID }}
        run: npm run integration-coverage:test:core
      - name: Upload integration coverage report
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 #v4
        with:
          name: coverage-core-integration
          path: packages/core/coverage/
          retention-days: 7

  # Test both extensions with E2E tests
  end-to-end-tests:
    name: End-to-End Tests
    strategy:
      max-parallel: 1
      matrix:
        extension: [checkmarx]
        os: [cx-public-ubuntu-x64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          persist-credentials: false
      - name: Verify single lockfile
        run: |
          if [ -f yarn.lock ] && [ -f package-lock.json ]; then
            echo "❌ ERROR: Both yarn.lock and package-lock.json found. Policy requires exactly ONE package manager. Allowed: npm + package-lock.json OR Yarn + yarn.lock"
            exit 1
          fi
          if [ ! -f yarn.lock ] && [ ! -f package-lock.json ]; then
            echo "❌ ERROR: No lockfile found. Policy requires exactly ONE package manager lockfile. Required: npm + package-lock.json OR Yarn + yarn.lock"
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 22.11.0
      - name: Authenticate with npm registries
        env:
          ECHO_TOKEN: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "registry=https://npm.echohq.com/" > ~/.npmrc
          echo "//npm.echohq.com/:_authToken=${ECHO_TOKEN}" >> ~/.npmrc
          echo "//packages.echohq.com/:_authToken=${ECHO_TOKEN}" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
      - name: Install dependencies
        env:
          NPM_CONFIG_LOGLEVEL: http
        run: |
          npm run ci:all
      - name: Build all packages
        run: npm run build:all
      - name: Run e2e tests
        if: runner.os == 'Linux'
        env:
          CX_APIKEY: ${{ secrets.CX_APIKEY_E2E_DEU }}
        run: |
          sudo apt-get install xvfb
          export DISPLAY=:99.0
          Xvfb -ac :99 -screen 0 1920x1080x16 &
          npm run e2e:test:checkmarx
      - name: Upload test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 #v4
        with:
          name: e2e-artifacts-${{ matrix.extension }}-${{ matrix.os }}
          path: |
            packages/core/test-resources/screenshots/*.png
          retention-days: 2

  # Run integration tests for both extensions, split into independent batches
  # so one failing/flaky file doesn't block or hide the result of the rest,
  # and so the ~41-minute single-job runtime is spread across parallel runners.
  ui-tests:
    name: UI Integration Tests (${{ matrix.batch.name }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        extension: [checkmarx]
        os: [cx-public-ubuntu-x64]
        batch:
          - name: auth-and-settings
            files: >-
              ./out/test/0.welcome.test.js
              ./out/test/1.settings.test.js
              ./out/test/4.oauthAuthentication.test.js
              ./out/test/20.oauthInvalidAuthentication.test.js
              ./out/test/9.scaResults.test.js
              ./out/test/16.branchFilterByProject.test.js
              ./out/test/24.scaRealtimeScanner.test.js
          - name: results-tree-and-menus
            files: >-
              ./out/test/2.wizardResults.test.js
              ./out/test/3.simpleResults.test.js
              ./out/test/6.customActions.test.js
              ./out/test/12.scsGroubByFilterWindow.test.js
          - name: scan-id-and-details
            files: >-
              ./out/test/5.scanIDResult.test.js
              ./out/test/7.scan.test.js
              ./out/test/8.NoResult.test.js
              ./out/test/13.editIconErrors.test.js
              ./out/test/14.severityIconsDefault.test.js
              ./out/test/21.sastTriageUpdate.test.js
          - name: groupby-pagination-and-sca
            files: >-
              ./out/test/11.pagination.test.js
              ./out/test/15.scaVulnerabilityDetails.test.js
              ./out/test/17.runScanFromIde.test.js
              ./out/test/18.groupByMenuOptions.test.js
              ./out/test/19.groupBySelectionPersistence.test.js
              ./out/test/22.secretFilePathLink.test.js
              ./out/test/23.aiSecurityChampionTab.test.js
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          persist-credentials: false
      - name: Verify single lockfile
        run: |
          if [ -f yarn.lock ] && [ -f package-lock.json ]; then
            echo "❌ ERROR: Both yarn.lock and package-lock.json found. Policy requires exactly ONE package manager. Allowed: npm + package-lock.json OR Yarn + yarn.lock"
            exit 1
          fi
          if [ ! -f yarn.lock ] && [ ! -f package-lock.json ]; then
            echo "❌ ERROR: No lockfile found. Policy requires exactly ONE package manager lockfile. Required: npm + package-lock.json OR Yarn + yarn.lock"
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 22.11.0
      - name: Authenticate with npm registries
        env:
          ECHO_TOKEN: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "registry=https://npm.echohq.com/" > ~/.npmrc
          echo "//npm.echohq.com/:_authToken=${ECHO_TOKEN}" >> ~/.npmrc
          echo "//packages.echohq.com/:_authToken=${ECHO_TOKEN}" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
      - name: Install dependencies
        env:
          NPM_CONFIG_LOGLEVEL: http
        run: |
          npm run ci:all
      - name: Build all packages
        run: npm run build:all

      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        env:
          CX_API_KEY: ${{ secrets.CX_API_KEY }}
          CX_TEST_SCAN_ID: ${{ secrets.CX_TEST_SCAN_ID }}
        run: |
          sudo apt-get install xvfb
          export DISPLAY=:99.0
          Xvfb -ac :99 -screen 0 1920x1080x16 &
          cd packages/checkmarx
          node scripts/run-ui-tests.js true ${{ matrix.batch.files }}
      - name: Upload test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 #v4
        with:
          name: integration-artifacts-${{ matrix.extension }}-${{ matrix.os }}-${{ matrix.batch.name }}
          path: |
            packages/core/test-resources/screenshots/*.png
          retention-days: 2
      - name: Upload screenshots
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 #v4
        if: failure() && runner.os == 'macOS'
        with:
          name: screenshots-${{ matrix.extension }}-${{ matrix.batch.name }}
          path: /Users/runner/work/ast-vscode-extension/ast-vscode-extension/packages/core/test-resources/screenshots/*.png
